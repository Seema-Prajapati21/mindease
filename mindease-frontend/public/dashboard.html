<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindEase — Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Bulletproof Auth Guard in <head> -->
  <script>
    (function() {
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem("currentUser") || "null");
      } catch (e) {}
      if (!user || !user.email) {
        document.documentElement.style.display = 'none';
        window.location.replace("signup.html");
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    :root {
      --me-bg: #FBF8F3;
      --me-primary: #8FA68E;
      --me-text: #2E2E2E;
      --me-border: #E8E2D8;
    }
    body { background-color: var(--me-bg); color: var(--me-text); font-family: system-ui, -apple-system, sans-serif; }
    .me-card { background: #fff; border: 1px solid var(--me-border); border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .hidden { display: none !important; }
    .history-card { background: #fff; border: 1px solid var(--me-border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.85rem; }
    .history-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; background: transparent; border-bottom: none; padding: 0; }
    .date-badge { font-size: 0.8rem; color: #8A8A8A; font-weight: 500; }
    .mood-badge { font-size: 0.82rem; background: #e8efe7; color: #2e442d; padding: 0.2rem 0.65rem; border-radius: 999px; font-weight: 600; }
    .ai-summary { font-size: 0.92rem; color: var(--me-text); margin-bottom: 0.35rem; }
    .journal-quote { font-size: 0.85rem; color: #717171; font-style: italic; margin-bottom: 0; border-left: 2.5px solid var(--me-primary); padding-left: 0.65rem; }
    .btn-me-primary { background-color: var(--me-primary); border-color: var(--me-primary); color: #fff; font-weight: 500; border-radius: 8px; }
    .btn-me-primary:hover { background-color: #7b947a; color: #fff; }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 960px;">
    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h1 class="h3 mb-1">Welcome back</h1>
        <p class="text-muted small mb-0">Here is how your rhythm looks.</p>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" onclick="seedDemoData()">
          ⚡ Populate 7-Day Demo History
        </button>
        <a href="checkin.html" class="btn btn-me-primary">
          Begin Daily Check-In →
        </a>
      </div>
    </div>

    <!-- Metric Cards -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="me-card p-4 h-100">
          <span class="small text-muted text-uppercase">Streak</span>
          <div id="metric-streak" class="h3 mb-0 mt-1" style="color: #5C785B;">0 Days 🔥</div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="me-card p-4 h-100">
          <span class="small text-muted text-uppercase">Dominant Mood</span>
          <div id="metric-dominant" class="h3 mb-0 mt-1" style="color: var(--me-primary);">None</div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="me-card p-4 h-100">
          <span class="small text-muted text-uppercase">Average Intensity</span>
          <div id="metric-avg" class="h3 mb-0 mt-1" style="color: #E0A96D;">0.0 / 10</div>
        </div>
      </div>
    </div>

    <!-- Charts Container -->
    <div id="charts-container" class="mb-4 hidden">
      <div class="row g-3">
        <div class="col-12 col-lg-8">
          <div class="me-card p-4 h-100">
            <h3 class="h5 mb-3">7-Day Intensity Trend</h3>
            <div style="height: 260px; position: relative;">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="me-card p-4 h-100">
            <h3 class="h5 mb-3">Mood Distribution</h3>
            <div style="height: 260px; position: relative;">
              <canvas id="doughnutChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State Card -->
    <div id="empty-state-card" class="me-card p-5 text-center mb-4">
      <span style="font-size: 3rem;">🍃</span>
      <h3 class="h4 mt-3 mb-2">No check-in entries yet</h3>
      <p class="text-muted small mb-4">Begin your check-in or populate demo history to preview your charts.</p>
      <button type="button" class="btn btn-me-primary px-4 py-2" onclick="seedDemoData()">
        ⚡ Populate 7-Day Demo History
      </button>
    </div>

    <!-- History Timeline -->
    <div class="my-4">
      <h3 class="h5 mb-3">Recent History Timeline</h3>
      <div id="history-timeline"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
